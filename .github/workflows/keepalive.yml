name: Keepalive
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Keep repository & workflow alive
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          workflow_files: "main.yml"
          time_elapsed: 45
          use_api: false
