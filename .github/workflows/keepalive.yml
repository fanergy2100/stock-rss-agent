name: Keepalive
on:
  schedule:
    # 每月1号 UTC 0点跑一次，足够防止60天休眠
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "4189828+github-actions[bot]@users.noreply.github.com"

      - name: Empty commit to keep schedule alive
        run: |
          git pull
          git commit --allow-empty -m "chore: empty heartbeat to prevent scheduled workflow suspension"
          git push
